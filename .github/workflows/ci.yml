name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR only needs its latest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Deliberately no Supabase credentials: the build must not need a secret
      # to succeed. If this step starts failing, something has begun reaching
      # for the database at build time instead of at request time.
      - name: Build without secrets
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # PRD §18: dependency/security scanning in CI. Production dependencies are
      # the ones that ship, so a vulnerability there fails the build; dev-only
      # advisories are reported without blocking a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory)
        run: npm audit || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The service-role key bypasses RLS entirely, so the one mistake that
      # matters most is committing it. This catches the shape of a Supabase
      # secret and of a .env file, in tracked content only.
      - name: Check for committed secrets
        run: |
          set -euo pipefail

          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked. Remove it and rotate anything it held."
            exit 1
          fi

          # Supabase service-role JWTs and the newer sb_secret_ format.
          if git grep -nIE '(sb_secret_[A-Za-z0-9_-]{16,}|"?service_role"?\s*:\s*")' -- \
              ':!*.md' ':!.github/workflows/*' > /tmp/hits 2>/dev/null; then
            echo "::error::Possible service-role credential in tracked files:"
            cat /tmp/hits
            exit 1
          fi

          echo "No tracked secrets found."
